<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Project pages: scroll to hero before React loads (production scroll restoration) -->
    <script>
      (function () {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        function top() {
          var p = location.pathname || "";
          if (p.indexOf("/projects/") !== 0) return;
          if (location.hash) {
            history.replaceState(null, "", p + location.search);
          }
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        }
        top();
        document.addEventListener("DOMContentLoaded", top);
        window.addEventListener("load", top);
        window.addEventListener("pageshow", top);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="J Communities — building more than homes; creating living experiences across Egypt and New Jersey."
    />
    <meta property="og:title" content="J Communities" />
    <meta
      property="og:description"
      content="Building more than homes — coastal escapes to urban destinations, designed for every lifestyle."
    />
